name: Documentation

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore documentation tool
        run: dotnet tool restore

      - name: Restore library
        run: dotnet restore StatisticalRobot-Lib/StatisticalRobot-Lib.csproj

      - name: Compile library and XML comments
        run: dotnet build StatisticalRobot-Lib/StatisticalRobot-Lib.csproj --configuration Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Generate API reference and site
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      - name: Check required pages
        shell: bash
        run: |
          test -s docs/_site/index.html
          test -s docs/_site/guide/index.html
          test -s docs/_site/guide/documentation-setup.html
          test -s docs/_site/api/Avans.StatisticalRobot.Robot.html
          test -s docs/_site/index.json

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
